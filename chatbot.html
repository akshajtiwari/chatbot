<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>College Chatbot Widget</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #fff;
            min-height: 100vh;
            padding: 20px;
        }

        /* Demo page content */
        .demo-content {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        .demo-content h1 {
            color: #1f2937;
            margin-bottom: 20px;
            font-size: 32px;
        }

        .demo-content p {
            color: #6b7280;
            line-height: 1.6;
            margin-bottom: 16px;
        }

        /* Chat Bubble Trigger */
        .chat-bubble {
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 1000;
        }

        .chat-trigger {
            position: relative;
            background: transparent;
            border: none;
            padding: 0;
            border-radius: 50%;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            cursor: pointer;
            transition: all 0.35s cubic-bezier(0.4, 0.0, 0.2, 1);
            animation: gentle-bounce 3s infinite;
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .chat-trigger:hover {
            transform: scale(1.1);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
            filter: brightness(1.08) saturate(1.1);
        }

        .chat-trigger .chat-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-image: url('./avatar.jpg');
            background-size: cover;
            background-position: center;
            border: 2px solid #fff;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
        }

        .notification-dot {
            position: absolute;
            top: -4px;
            right: -4px;
            width: 16px;
            height: 16px;
            background: #ef4444;
            border-radius: 50%;
            border: 2px solid white;
            animation: ping 2s infinite;
        }

        .tooltip {
            position: absolute;
            bottom: 100%;
            right: 0;
            margin-bottom: 8px;
            padding: 8px 12px;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            font-size: 12px;
            border-radius: 8px;
            white-space: nowrap;
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.3s ease;
            pointer-events: none;
        }

        .tooltip::after {
            content: '';
            position: absolute;
            top: 100%;
            right: 16px;
            border: 4px solid transparent;
            border-top-color: rgba(0, 0, 0, 0.8);
        }

        .chat-trigger:hover .tooltip {
            opacity: 1;
            transform: translateY(0);
        }

        /* Chatbot Widget */
        .chatbot-widget {
            position: fixed;
            bottom: 24px;
            right: 24px;
            width: 384px;
            height: 600px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.3);
            display: none;
            flex-direction: column;
            overflow: hidden;
            z-index: 1000;
            animation: slide-up 0.3s ease-out;
        }

        .chatbot-widget.open {
            display: flex;
        }

        /* Header */
        .chat-header {
            background: linear-gradient(135deg, #3b82f6, #8b5cf6, #6366f1);
            padding: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: white;
        }

        .avatar-section {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .avatar {
            width: 48px;
            height: 48px;
            background: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            padding: 2px;
        }

        .avatar-inner {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background-size: cover;
            background-position: center;
            background-image: url('./avatar.jpg');
            border: 2px solid #fff;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
        }

        .status-info h3 {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 2px;
        }

        .online-status {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 11px;
            opacity: 0.9;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: #22c55e;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        .header-controls {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .language-select {
            background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 50%, #6366f1 100%);
            border: 2px solid #3b82f6;
            border-radius: 8px;
            padding: 4px 15px;
            color: #fff;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            backdrop-filter: blur(10px);
            box-shadow: 0 2px 8px rgba(99,102,241,0.10);
            transition: box-shadow 0.35s cubic-bezier(0.4,0,0.2,1), background 0.35s cubic-bezier(0.4,0,0.2,1), color 0.35s cubic-bezier(0.4,0,0.2,1), border 0.35s cubic-bezier(0.4,0,0.2,1);
            outline: none;
        }

        .language-select:focus, .language-select:hover {
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 50%, #3b82f6 100%);
            color: #fff;
            border: 2px solid #3b82f6;
            box-shadow: 0 6px 24px rgba(59,130,246,0.18);
        }

        .language-select option {
            color: #222;
            background: #fff !important;
            font-weight: 500;
            border: none;
        }

        .close-btn {
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.8);
            cursor: pointer;
            padding: 4px;
            border-radius: 6px;
            transition: all 0.35s cubic-bezier(0.4, 0.0, 0.2, 1);
        }

        .close-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            filter: brightness(1.08) saturate(1.1);
        }

        /* Messages Area */
        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            background: #f8fafc;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .message {
            display: flex;
            gap: 8px;
            animation: slide-in 0.3s ease-out;
        }

        .message.user {
            flex-direction: row-reverse;
        }

        .message-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .message-avatar.bot {
            background-image: url('./avatar.jpg');
            background-size: cover;
            background-position: center;
            border: 2px solid #fff;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
        }

        .message-avatar.user {
            background: #e5e7eb;
            color: #6b7280;
        }

        .message-avatar svg {
            width: 16px;
            height: 16px;
            color: white;
        }

        .message-content {
            max-width: 280px;
            padding: 12px 16px;
            border-radius: 16px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            position: relative;
        }

        .message-content.bot {
            background: white;
            color: #374151;
            border: 1px solid #e5e7eb;
        }

        .message-content.user {
            background: #3b82f6;
            color: white;
            margin-left: auto;
        }

        .message-text {
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 4px;
        }

        .message-time {
            font-size: 11px;
            opacity: 0.7;
        }

        /* Quick Suggestions */
        .quick-suggestions {
            margin-top: 16px;
        }

        .suggestions-label {
            font-size: 11px;
            color: #6b7280;
            text-align: center;
            margin-bottom: 8px;
        }

        .suggestions-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .suggestion-btn {
            padding: 12px 16px;
            background: linear-gradient(135deg, #4ecdc4 0%, #45b7d1 100%);
            border: none;
            border-radius: 12px;
            font-size: 13px;
            color: #fff;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 16px rgba(78,205,196,0.10);
            transition: box-shadow 0.35s cubic-bezier(0.4, 0.0, 0.2, 1), filter 0.35s cubic-bezier(0.4, 0.0, 0.2, 1), background 0.35s cubic-bezier(0.4, 0.0, 0.2, 1), color 0.35s cubic-bezier(0.4, 0.0, 0.2, 1);
            position: relative;
            outline: none;
        }
        .suggestion-btn:hover, .suggestion-btn:focus {
            box-shadow: 0 8px 24px rgba(78,205,196,0.18), 0 2px 8px rgba(0,0,0,0.08);
            filter: brightness(1.08) saturate(1.08);
            transform: scale(1.03);
        }
        

        .suggestion-btn:hover {
            background: linear-gradient(135deg, #4ecdc4 0%, #45b7d1 100%);
            border-color: #45b7d1;
            color: #fff;
            filter: brightness(1.08) saturate(1.08);
            transform: scale(1.03);
        }

        /* Typing Indicator */
        .typing-indicator {
            display: flex;
            gap: 8px;
            animation: slide-in 0.3s ease-out;
        }

        .typing-dots {
            background: white;
            border-radius: 16px;
            padding: 12px 16px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            border: 1px solid #e5e7eb;
            display: flex;
            gap: 4px;
        }

        .typing-dot {
            width: 8px;
            height: 8px;
            background: #9ca3af;
            border-radius: 50%;
            animation: typing-bounce 1.5s infinite ease-in-out;
        }

        .typing-dot:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-dot:nth-child(3) {
            animation-delay: 0.4s;
        }

        /* Input Area */
        .input-area {
            background: white;
            border-top: 1px solid #e5e7eb;
            padding: 16px;
        }

        .input-container {
            display: flex;
            gap: 8px;
            align-items: end;
            opacity: 1;
            transition: opacity 0.3s ease;
        }

        .footer-info {
            opacity: 1;
            transition: opacity 0.3s ease;
        }

        .input-wrapper {
            flex: 1;
            position: relative;
        }

        .message-input {
            width: 100%;
            padding: 12px 48px 12px 16px;
            border: 1px solid #d1d5db;
            border-radius: 12px;
            resize: none;
            min-height: 44px;
            max-height: 100px;
            font-size: 14px;
            font-family: inherit;
            transition: all 0.2s ease;
            outline: none;
        }

        .message-input:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        .input-action-btn {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            border: none;
            padding: 8px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .send-btn {
            background: #3b82f6;
            color: white;
        }

        .send-btn:hover {
            background: #2563eb;
        }

        .mic-btn {
            background: #e5e7eb;
            transition: background 0.35s cubic-bezier(0.4, 0.0, 0.2, 1), filter 0.35s cubic-bezier(0.4, 0.0, 0.2, 1);

        }

        .mic-btn:hover {
            background: linear-gradient(135deg, #4ecdc4 0%, #45b7d1 100%);
            filter: brightness(1.12) saturate(1.15);
        }

        .mic-btn.recording {
            background: #ef4444;
            color: white;
            animation: pulse 1s infinite;
        }

        .input-action-btn svg {
            width: 16px;
            height: 16px;
        }

        .recording-indicator {
            position: absolute;
            left: 0;
            right: 0;
            top: 0;
            bottom: 0;
            background: #ffffff;
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .recording-indicator::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 220px;
            height: 220px;
            background: radial-gradient(circle at center,
                rgba(99, 102, 241, 0.1) 0%,
                rgba(99, 102, 241, 0.05) 40%,
                transparent 70%);
            transform: translate(-50%, -50%);
            animation: subtle-pulse 4s ease-in-out infinite;
        }

        @keyframes subtle-pulse {
            0%, 100% {
                transform: translate(-50%, -50%) scale(1);
                opacity: 0.5;
            }
            50% {
                transform: translate(-50%, -50%) scale(1.2);
                opacity: 0.3;
            }
        }

        .recording-visualization {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
            padding: 20px;
            background: #f8fafc;
        }

        .nebula-wave {
            position: relative;
            width: 280px;
            height: 280px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .nebula-wave::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: url('./voice.png');
            background-size: contain;
            background-position: center;
            background-repeat: no-repeat;
            opacity: 0.9;
            animation: voice-revolve 6s linear infinite, voice-pulse 2.5s ease-in-out infinite;
            filter: hue-rotate(200deg) saturate(1.2);
        }

        .nebula-wave::after {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: url('./voice.png');
            background-size: contain;
            background-position: center;
            background-repeat: no-repeat;
            opacity: 0.4;
            animation: voice-wave-echo 3s ease-in-out infinite;
            filter: hue-rotate(200deg) saturate(1.2) blur(2px);
        }

        @keyframes voice-revolve {
            0% { transform: rotate(0deg) scale(1); }
            100% { transform: rotate(360deg) scale(1); }
        }

        @keyframes voice-pulse {
            0%, 100% {
                filter: hue-rotate(200deg) saturate(1.2) brightness(1);
                opacity: 0.9;
            }
            50% {
                filter: hue-rotate(200deg) saturate(1.4) brightness(1.15);
                opacity: 1;
            }
        }

        @keyframes voice-wave-echo {
            0%, 100% {
                transform: scale(1.1);
                opacity: 0.3;
            }
            50% {
                transform: scale(1.15);
                opacity: 0.4;
            }
        }

        .recording-controls {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            background: linear-gradient(transparent, #ffffff 50%);
        }

        .recording-time {
            font-size: 16px;
            font-weight: 500;
            color: #ef4444;
        }

        .recording-actions {
            display: flex;
            gap: 16px;
        }

        .recording-cancel,
        .recording-done {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            border-radius: 8px;
            border: none;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .recording-cancel {
            background: #fee2e2;
            color: #ef4444;
        }

        .recording-done {
            background: #dcfce7;
            color: #16a34a;
        }

        .recording-cancel:hover {
            background: #fecaca;
        }

        .recording-done:hover {
            background: #bbf7d0;
        }

        .recording-actions svg {
            width: 16px;
            height: 16px;
            stroke-width: 2.5;
        }

        @keyframes wave-animation {
            0%, 100% {
                transform: scaleY(1) translateX(0);
            }
            50% {
                transform: scaleY(1.2) translateX(-25%);
            }
        }

        .footer-info {
            margin-top: 8px;
            text-align: center;
            font-size: 11px;
            color: #6b7280;
        }

        /* Animations */
        @keyframes gentle-bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        @keyframes ping {
            0% { transform: scale(1); opacity: 1; }
            75%, 100% { transform: scale(2); opacity: 0; }
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        @keyframes slide-up {
            from { 
                opacity: 0; 
                transform: translateY(20px) scale(0.95); 
            }
            to { 
                opacity: 1; 
                transform: translateY(0) scale(1); 
            }
        }

        @keyframes slide-in {
            from { 
                opacity: 0; 
                transform: translateX(20px); 
            }
            to { 
                opacity: 1; 
                transform: translateX(0); 
            }
        }

        @keyframes typing-bounce {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-8px); }
        }

        @keyframes audio-wave {
            0%, 100% { transform: scaleY(1); }
            50% { transform: scaleY(1.5); }
        }

        /* Scrollbar */
        .messages-container::-webkit-scrollbar {
            width: 4px;
        }

        .messages-container::-webkit-scrollbar-track {
            background: transparent;
        }

        .messages-container::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 2px;
        }

        .messages-container::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        /* Hide elements */
        .hidden {
            display: none !important;
        }

        /* Responsive */
        @media (max-width: 480px) {
            .chatbot-widget {
                width: calc(100vw - 32px);
                height: calc(100vh - 32px);
                bottom: 16px;
                right: 16px;
            }
        }
    </style>
</head>
<body>
    <!-- Only chatbot widget and trigger remain -->
    <!-- Chat Bubble Trigger -->
    <div class="chat-bubble" id="chatBubble">
        <button class="chat-trigger" onclick="openChatbot()">
            <div class="chat-avatar"></div>
            <div class="notification-dot"></div>
            <div class="tooltip">Need help? Ask me anything!</div>
        </button>
    </div>

    <!-- Chatbot Widget -->
    <div class="chatbot-widget" id="chatbotWidget">
        <!-- Header -->
        <div class="chat-header">
            <div class="avatar-section">
                <div class="avatar">
                    <div class="avatar-inner"></div>
                </div>
                <div class="status-info">
                    <h3>Campus Assistant</h3>
                    <div class="online-status">
                        <div class="status-dot"></div>
                        <span>Online</span>
                    </div>
                </div>
            </div>
            <div class="header-controls">
                <select class="language-select" id="languageSelect" onchange="changeLanguage()">
                    <option value="en">🇺🇸 English</option>
                    <option value="hi">🇮🇳 हिंदी</option>
                    <option value="bn">🇧🇩 বাংলা</option>
                    <option value="te">🇮🇳 తెలుగు</option>
                    <option value="ta">🇮🇳 தமிழ்</option>
                </select>
                <button class="close-btn" onclick="closeChatbot()">
                    <!-- X Icon -->
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>
        </div>

        <!-- Messages Container -->
        <div class="messages-container" id="messagesContainer">
            <!-- Messages will be dynamically added here -->
        </div>

        <!-- Input Area -->
        <div class="input-area">
            <div class="input-container">
                <div class="input-wrapper">
                    <textarea 
                        id="messageInput" 
                        class="message-input" 
                        placeholder="Type your message..." 
                        rows="1"
                        onkeypress="handleKeyPress(event)"
                        oninput="handleInputChange()"
                    ></textarea>
                    <button class="input-action-btn mic-btn" id="actionBtn" onclick="toggleAction()">
                        <!-- Mic Icon -->
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
                            <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                            <line x1="12" y1="19" x2="12" y2="23"></line>
                            <line x1="8" y1="23" x2="16" y2="23"></line>
                        </svg>
                    </button>
                </div>
            </div>
            <div class="recording-indicator hidden" id="recordingIndicator">
                <div class="recording-visualization">
                    <div class="nebula-wave"></div>
                    <div class="recording-controls">
                        <div class="recording-time">0:00</div>
                        <div class="recording-actions">
                            <button class="recording-cancel" onclick="stopRecording(true)">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <line x1="18" y1="6" x2="6" y2="18"></line>
                                    <line x1="6" y1="6" x2="18" y2="18"></line>
                                </svg>
                                Cancel
                            </button>
                            <button class="recording-done" onclick="sendVoiceMessage()">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <polyline points="20 6 9 17 4 12"></polyline>
                                </svg>
                                Done
                            </button>
                        </div>
                    </div>
                </div>
            </div>
            <div class="footer-info" id="footerInfo">
            </div>
        </div>
    </div>

    <script>
        // State management
        let isRecording = false;
        let currentLanguage = 'en';
        let messages = [];

        const languages = {
            'en': { name: 'English', flag: '🇺🇸' },
            'hi': { name: 'हिंदी', flag: '🇮🇳' },
            'bn': { name: 'বাংলা', flag: '🇧🇩' },
            'te': { name: 'తెలుగు', flag: '🇮🇳' },
            'ta': { name: 'தமিழ்', flag: '🇮🇳' }
        };

        const welcomeMessages = {
            'en': "👋 Hello! I'm your college assistant. I can help you with admissions, fee payments, course information, exam schedules, library services, and campus facilities. What would you like to know?",
            'hi': "👋 नमस्ते! मैं आपका कॉलेज सहायक हूं। मैं प्रवेश, फीस भुगतान, कोर्स की जानकारी, परीक्षा कार्यक्रम, पुस्तकालय सेवाओं और कैंपस सुविधाओं में मदद कर सकता हूं। आप क्या जानना चाहते हैं?",
            'bn': "👋 হ্যালো! আমি আপনার কলেজ সহায়ক। আমি ভর্তি, ফি পেমেন্ট, কোর্সের তথ্য, পরীক্ষার সময়সূচী, লাইব্রেরি সেবা এবং ক্যাম্পাস সুবিধায় সাহায্য করতে পারি। আপনি কী জানতে চান?",
            'te': "👋 హలో! నేను మీ కాలేజీ సహాయకుడిని. అడ্మిషన్లు, ఫీజు చెల్లింపులు, కోర్స్ సమాచారం, పరీక్ష షెడ్యూల్స్, లైబ్రరీ సేవలు మరియు క్యాంపస్ సౌకర్యాలలో సహాయం చేయగలను. మీరు ఏమి తెలుసుకోవాలనుకుంటున్నారు?",
            'ta': "👋 வணக்கம்! நான் உங்கள் கல்லூரி உதவியாளர். சேர்க்கை, கட்டணம், பாடநெறி தகவல், தேர்வு அட்டவணை, நூலக சேவைகள் மற்றும் வளாக வசதிகளில் உதவ முடியும். நீங்கள் என்ன தெரிந்து கொள்ள விரும்புகிறீர்கள்?"
        };

        const quickSuggestions = [
            "Fee payment deadlines",
            "Admission process", 
            "Exam schedule",
            "Library timings"
        ];

        // Functions
        function openChatbot() {
            document.getElementById('chatBubble').style.display = 'none';
            document.getElementById('chatbotWidget').classList.add('open');
            // Only show welcome if no messages yet
            if (messages.length === 0) {
                showWelcomeMessage();
            }
        }

        function closeChatbot() {
            document.getElementById('chatbotWidget').classList.remove('open');
            document.getElementById('chatBubble').style.display = 'block';
        }

        // Close chatbox when clicking outside
        document.addEventListener('mousedown', function(event) {
            const widget = document.getElementById('chatbotWidget');
            const bubble = document.getElementById('chatBubble');
            if (widget.classList.contains('open')) {
                if (!widget.contains(event.target) && !bubble.contains(event.target)) {
                    closeChatbot();
                }
            }
        });

        function showWelcomeMessage() {
            messages = [];
            const welcomeMsg = {
                id: Date.now(),
                text: welcomeMessages[currentLanguage],
                sender: 'bot',
                timestamp: new Date().toLocaleTimeString()
            };
            messages.push(welcomeMsg);
            renderMessages();
            showQuickSuggestions();
        }

        function changeLanguage() {
            currentLanguage = document.getElementById('languageSelect').value;
            document.getElementById('footerText').textContent = `Powered by AI • ${languages[currentLanguage].name}`;
            showWelcomeMessage();
        }

        function handleInputChange() {
            const input = document.getElementById('messageInput');
            const actionBtn = document.getElementById('actionBtn');
            
            if (input.value.trim()) {
                // Show send button
                actionBtn.className = 'input-action-btn send-btn';
                actionBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22,2 15,22 11,13 2,9 22,2"></polygon></svg>';
                actionBtn.onclick = sendMessage;
            } else {
                // Show mic button
                actionBtn.className = 'input-action-btn mic-btn';
                actionBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line></svg>';
                actionBtn.onclick = toggleRecording;
            }
        }

        function toggleAction() {
            const input = document.getElementById('messageInput');
            if (input.value.trim()) {
                sendMessage();
            } else {
                toggleRecording();
            }
        }

        function sendMessage() {
            const input = document.getElementById('messageInput');
            const message = input.value.trim();
            
            if (message) {
                const userMessage = {
                    id: Date.now(),
                    text: message,
                    sender: 'user',
                    timestamp: new Date().toLocaleTimeString()
                };
                
                messages.push(userMessage);
                input.value = '';
                handleInputChange();
                renderMessages();
                removeQuickSuggestions();
                
                // Show typing indicator
                showTypingIndicator();
                
                // Simulate bot response
                setTimeout(() => {
                    hideTypingIndicator();
                    const botResponse = {
                        id: Date.now() + 1,
                        text: "Thank you for your question! I'm here to help you with all your college-related queries. Let me find the most accurate information for you.",
                        sender: 'bot',
                        timestamp: new Date().toLocaleTimeString()
                    };
                    messages.push(botResponse);
                    renderMessages();
                }, 1500);
            }
        }

        let recordingStartTime = 0;
        let recordingTimer = null;

        function updateRecordingTime() {
            const now = Date.now();
            const diff = Math.floor((now - recordingStartTime) / 1000);
            const minutes = Math.floor(diff / 60);
            const seconds = diff % 60;
            const timeStr = `${minutes}:${seconds.toString().padStart(2, '0')}`;
            document.querySelector('.recording-time').textContent = timeStr;
        }

        function toggleRecording() {
            isRecording = !isRecording;
            const actionBtn = document.getElementById('actionBtn');
            const recordingIndicator = document.getElementById('recordingIndicator');
            const inputArea = document.querySelector('.input-container');
            const footerInfo = document.getElementById('footerInfo');
            
            if (isRecording) {
                // Hide input area and footer
                inputArea.style.opacity = '0';
                footerInfo.style.opacity = '0';
                setTimeout(() => {
                    inputArea.style.display = 'none';
                    footerInfo.style.display = 'none';
                }, 300);

                // Show recording interface
                actionBtn.classList.add('recording');
                recordingIndicator.classList.remove('hidden');
                removeQuickSuggestions();

                // Start recording timer
                recordingStartTime = Date.now();
                recordingTimer = setInterval(updateRecordingTime, 1000);
            } else {
                stopRecording();
            }
        }

        function stopRecording(cancelled = false) {
            const actionBtn = document.getElementById('actionBtn');
            const recordingIndicator = document.getElementById('recordingIndicator');
            const inputArea = document.querySelector('.input-container');
            const footerInfo = document.getElementById('footerInfo');

            // Show input area and footer
            inputArea.style.display = 'flex';
            footerInfo.style.display = 'block';
            setTimeout(() => {
                inputArea.style.opacity = '1';
                footerInfo.style.opacity = '1';
            }, 50);

            // Reset recording interface
            actionBtn.classList.remove('recording');
            actionBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line></svg>';
            recordingIndicator.classList.add('hidden');

            // Clear timer
            if (recordingTimer) {
                clearInterval(recordingTimer);
                recordingTimer = null;
            }

            isRecording = false;
        }

        function sendVoiceMessage() {
            stopRecording();
            
            // Add voice message to chat
            const voiceMessage = {
                id: Date.now(),
                text: "🎤 Voice message sent",
                sender: 'user',
                timestamp: new Date().toLocaleTimeString()
            };
            
            messages.push(voiceMessage);
            renderMessages();
            
            // Show bot response
            showTypingIndicator();
            setTimeout(() => {
                hideTypingIndicator();
                const botResponse = {
                    id: Date.now() + 1,
                    text: "I've received your voice message. Let me process that and respond accordingly.",
                    sender: 'bot',
                    timestamp: new Date().toLocaleTimeString()
                };
                messages.push(botResponse);
                renderMessages();
            }, 1500);
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
            }
        }

        function renderMessages() {
            const container = document.getElementById('messagesContainer');
            container.innerHTML = '';
            
            messages.forEach(message => {
                const messageDiv = document.createElement('div');
                messageDiv.className = 'message ' + message.sender;
                
                let avatarContent = '';
                if (message.sender === 'bot') {
                    avatarContent = ''; // Empty because we're using background-image
                } else {
                    avatarContent = '<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/></svg>';
                }
                
                messageDiv.innerHTML = 
                    '<div class="message-avatar ' + message.sender + '">' +
                        avatarContent +
                    '</div>' +
                    '<div class="message-content ' + message.sender + '">' +
                        '<div class="message-text">' + message.text + '</div>' +
                        '<div class="message-time">' + message.timestamp + '</div>' +
                    '</div>';
                
                container.appendChild(messageDiv);
            });
            
            scrollToBottom();
        }

        function showQuickSuggestions() {
            const container = document.getElementById('messagesContainer');
            const suggestionsDiv = document.createElement('div');
            suggestionsDiv.className = 'quick-suggestions';
            suggestionsDiv.id = 'quickSuggestions';
            
            let suggestionsHTML = '<div class="suggestions-label">Quick questions:</div><div class="suggestions-grid">';
            quickSuggestions.forEach(suggestion => {
                suggestionsHTML += '<button class="suggestion-btn" onclick="handleSuggestion(\'' + suggestion + '\')">' + suggestion + '</button>';
            });
            suggestionsHTML += '</div>';
            
            suggestionsDiv.innerHTML = suggestionsHTML;
            container.appendChild(suggestionsDiv);
            scrollToBottom();
        }

        function removeQuickSuggestions() {
            const suggestions = document.getElementById('quickSuggestions');
            if (suggestions) {
                suggestions.remove();
            }
        }

        function handleSuggestion(suggestion) {
            const userMessage = {
                id: Date.now(),
                text: suggestion,
                sender: 'user',
                timestamp: new Date().toLocaleTimeString()
            };
            messages.push(userMessage);
            renderMessages();
            removeQuickSuggestions();
            
            // Show typing and respond
            showTypingIndicator();
            setTimeout(() => {
                hideTypingIndicator();
                const botResponse = {
                    id: Date.now() + 1,
                    text: `Here's what you need to know about ${suggestion.toLowerCase()}. I'll provide you with the most up-to-date information from our college database.`,
                    sender: 'bot',
                    timestamp: new Date().toLocaleTimeString()
                };
                messages.push(botResponse);
                renderMessages();
            }, 1200);
        }

        function showTypingIndicator() {
            const container = document.getElementById('messagesContainer');
            const typingDiv = document.createElement('div');
            typingDiv.className = 'typing-indicator';
            typingDiv.id = 'typingIndicator';
            
            typingDiv.innerHTML = `
                <div class="message-avatar bot"></div>
                <div class="typing-dots">
                    <div class="typing-dot"></div>
                    <div class="typing-dot"></div>
                    <div class="typing-dot"></div>
                </div>
            `;
            
            container.appendChild(typingDiv);
            scrollToBottom();
        }

        function hideTypingIndicator() {
            const typing = document.getElementById('typingIndicator');
            if (typing) {
                typing.remove();
            }
        }

        function scrollToBottom() {
            const container = document.getElementById('messagesContainer');
            container.scrollTop = container.scrollHeight;
        }

        function updateFooter() {
            document.getElementById('footerText').textContent = 'Powered by AI • ' + languages[currentLanguage].name;
        }

        // Initialize when page loads
        window.onload = function() {
            updateFooter();
            // Auto-open chatbot for demo (remove this line for production)
            setTimeout(function() {
                document.getElementById('chatBubble').style.display = 'block';
            }, 1000);
        };
    </script>
</body>
</html>
