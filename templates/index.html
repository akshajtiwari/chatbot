<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Pipeline Admin Control Panel</title>
    <link rel="stylesheet" href="/static/style.css"> 
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <h1>Data Pipeline Control Panel</h1>
            <p>Manage ERP configurations and scraped data from here.</p>
        </header>

        <!-- Section 1: ERP Configuration Management -->
        <section class="card">
            <h2>ERP Configuration</h2>
            <div class="config-loader">
                <select id="config-select">
                    <option value="">-- Select an ERP Configuration --</option>
                    {% for config in configs %}
                        <option value="{{ config._id }}">{{ config.erp_name }}</option>
                    {% endfor %}
                </select>
                <button type="button" id="load-config-btn" class="btn-secondary">Load</button>
                <button type="button" id="new-config-btn" class="btn-secondary">New</button>
            </div>

            <form id="scraper-form">
                <input type="hidden" id="config_id" name="config_id">
                
                <div class="form-group">
                    <label for="erp_name">ERP Name</label>
                    <input type="text" id="erp_name" name="erp_name" placeholder="e.g., Main Campus ERP" required>
                </div>
                
                <div class="form-group">
                    <label for="login_url">Login URL (Form Action)</label>
                    <input type="text" id="login_url" name="login_url" placeholder="e.g., https://erp.college.edu/Auth" required>
                </div>
                
                <div class="form-group">
                    <label for="username_payload_key">Username Payload Key</label>
                    <input type="text" id="username_payload_key" name="username_payload_key" placeholder="e.g., username" required>
                </div>
    
                <div class="form-group">
                    <label for="password_payload_key">Password Payload Key</label>
                    <input type="text" id="password_payload_key" name="password_payload_key" placeholder="e.g., password" required>
                </div>
    
                <div class="form-group">
                    <label for="target_urls">Target URLs to Scrape (one per line)</label>
                    <textarea id="target_urls" name="target_urls" rows="4" placeholder="e.g., https://erp.college.edu/Student/Notices" required></textarea>
                </div>
    
                <div class="form-group">
                    <label for="supported_file_types">File Types to Download (one per line)</label>
                    <textarea id="supported_file_types" name="supported_file_types" rows="3" placeholder=".pdf&#10;.docx&#10;.jpg" required></textarea>
                </div>

                <hr>

                <h3>Run Scraper with Credentials</h3>
                <div class="form-group">
                    <label for="username">ERP Username</label>
                    <input type="text" id="username" name="username" required>
                </div>
                <div class="form-group">
                    <label for="password">ERP Password</label>
                    <input type="password" id="password" name="password" required>
                </div>
                
                <div class="config-actions">
                    <button type="button" id="save-config-btn" class="btn-primary">Save Configuration</button>
                    <button type="button" id="start-scraping-btn" class="btn-action">Start Scraping</button>
                </div>
            </form>
        </section>

        <!-- Section 2: Data Management -->
        <section class="card">
            <h2>Manage Scraped Data</h2>
            <button id="load-documents-btn" class="btn-secondary">Load / Refresh Documents</button>
            <div class="table-container">
                <table id="documents-table">
                    <thead>
                        <tr>
                            <th>File/Source</th>
                            <th>Status</th>
                            <th>Type</th>
                            <th>Timestamp</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Data will be loaded here by JavaScript -->
                    </tbody>
                </table>
            </div>
        </section>

        <div id="response-message"></div>
    </div>
    
    <script>
        // --- DOM Elements ---
        const configSelect = document.getElementById('config-select');
        const loadConfigBtn = document.getElementById('load-config-btn');
        const newConfigBtn = document.getElementById('new-config-btn');
        const saveConfigBtn = document.getElementById('save-config-btn');
        const startScrapingBtn = document.getElementById('start-scraping-btn');
        const loadDocumentsBtn = document.getElementById('load-documents-btn');
        const documentsTableBody = document.querySelector('#documents-table tbody');
        const responseMessage = document.getElementById('response-message');
        const form = document.getElementById('scraper-form');

        // --- Functions ---
        function clearForm() {
            form.reset();
            document.getElementById('config_id').value = '';
            configSelect.value = '';
        }
        
        function showMessage(msg, type) {
            responseMessage.textContent = msg;
            responseMessage.className = `message-${type}`;
        }

        // --- Event Listeners ---
        newConfigBtn.addEventListener('click', clearForm);

        loadConfigBtn.addEventListener('click', async () => {
            const configId = configSelect.value;
            if (!configId) {
                showMessage('Please select a configuration to load.', 'info');
                return;
            }
            try {
                const response = await fetch(`/get_config/${configId}`);
                if (response.ok) {
                    const config = await response.json();
                    document.getElementById('config_id').value = config._id;
                    document.getElementById('erp_name').value = config.erp_name;
                    document.getElementById('login_url').value = config.login_url;
                    document.getElementById('username_payload_key').value = config.username_payload_key;
                    document.getElementById('password_payload_key').value = config.password_payload_key;
                    document.getElementById('target_urls').value = config.target_urls.join('\n');
                    document.getElementById('supported_file_types').value = config.supported_file_types.join('\n');
                    showMessage('Configuration loaded.', 'success');
                } else {
                    showMessage('Failed to load configuration.', 'error');
                }
            } catch (error) {
                showMessage('Network error loading configuration.', 'error');
            }
        });

        saveConfigBtn.addEventListener('click', async () => {
            const formData = {
                config_id: document.getElementById('config_id').value,
                erp_name: document.getElementById('erp_name').value,
                login_url: document.getElementById('login_url').value,
                username_payload_key: document.getElementById('username_payload_key').value,
                password_payload_key: document.getElementById('password_payload_key').value,
                target_urls: document.getElementById('target_urls').value.split('\n').filter(Boolean),
                supported_file_types: document.getElementById('supported_file_types').value.split('\n').filter(Boolean),
            };

            try {
                const response = await fetch('/save_config', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(formData)
                });
                const result = await response.json();
                showMessage(result.message, 'success');
                // Optionally reload the page to see the new config in the dropdown
                window.location.reload();
            } catch (error) {
                showMessage('Error saving configuration.', 'error');
            }
        });

        startScrapingBtn.addEventListener('click', async () => {
            const payload = {
                config_id: document.getElementById('config_id').value,
                username: document.getElementById('username').value,
                password: document.getElementById('password').value,
            };

            if (!payload.config_id) {
                showMessage('Please load or save a configuration before starting.', 'error');
                return;
            }

            showMessage('Starting scraper process...', 'info');
            try {
                const response = await fetch('/start_scraping', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const result = await response.json();
                showMessage(result.message, response.ok ? 'success' : 'error');
            } catch (error) {
                showMessage('Network error starting scraper.', 'error');
            }
        });

        loadDocumentsBtn.addEventListener('click', async () => {
            showMessage('Loading documents...', 'info');
            try {
                const response = await fetch('/get_documents');
                const documents = await response.json();
                documentsTableBody.innerHTML = ''; // Clear existing rows
                documents.forEach(doc => {
                    const row = documentsTableBody.insertRow();
                    const source = doc.file_name || doc.source_url;
                    const timestamp = new Date(doc.download_timestamp * 1000).toLocaleString();

                    row.innerHTML = `
                        <td>${source}</td>
                        <td>${doc.status}</td>
                        <td>${doc.file_type}</td>
                        <td>${timestamp}</td>
                        <td><button class="delete-btn" data-id="${doc._id}">Delete</button></td>
                    `;
                });
                showMessage(`Loaded ${documents.length} documents.`, 'success');
            } catch (error) {
                showMessage('Error loading documents.', 'error');
            }
        });

        documentsTableBody.addEventListener('click', async (event) => {
            if (event.target.classList.contains('delete-btn')) {
                const docId = event.target.dataset.id;
                if (confirm('Are you sure you want to delete this document?')) {
                    try {
                        await fetch(`/delete_document/${docId}`, { method: 'POST' });
                        event.target.closest('tr').remove(); // Remove row from table
                        showMessage('Document deleted.', 'success');
                    } catch (error) {
                        showMessage('Error deleting document.', 'error');
                    }
                }
            }
        });

    </script>
</body>
</html>
