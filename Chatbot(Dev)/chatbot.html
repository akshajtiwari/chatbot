<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>College Chatbot Widget</title>
    <link rel="stylesheet" href="chatbot.css">
    <script src="chatbot.js"></script>
</head>
<body>
    <div class="chat-bubble" id="chatBubble">
        <button class="chat-trigger" onclick="openChatbot()">
            <div class="chat-avatar"></div>
            <div class="notification-dot"></div>
            <div class="tooltip">Need help? Ask me anything!</div>
        </button>
    </div>

    
    <div class="chatbot-widget" id="chatbotWidget">
        
        <div class="chat-header">
            <div class="avatar-section">
                <div class="avatar">
                    <div class="avatar-inner"></div>
                </div>
                <div class="status-info">
                    <h3>Campus Assistant</h3>
                    <div class="online-status">
                        <div class="status-dot"></div>
                        <span>Online</span>
                    </div>
                </div>
            </div>
            <div class="header-controls">
                <select class="language-select" id="languageSelect" onchange="changeLanguage()">
                    <option value="en">🇺🇸 English</option>
                    <option value="hi">🇮🇳 हिंदी</option>
                    <option value="bn">🇧🇩 বাংলা</option>
                    <option value="te">🇮🇳 తెలుగు</option>
                    <option value="ta">🇮🇳 தமிழ்</option>
                </select>
                <button class="close-btn" onclick="closeChatbot()">
                    
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>
        </div>

        
        <div class="messages-container" id="messagesContainer">
            <!-- Messages will be dynamically added here -->
        </div>

        
        <div class="input-area">
            <div class="input-container">
                <div class="input-wrapper">
                    <textarea 
                        id="messageInput" 
                        class="message-input" 
                        placeholder="Type your message..." 
                        rows="1"
                        onkeypress="handleKeyPress(event)"
                        oninput="handleInputChange()"
                    ></textarea>
                    <button class="input-action-btn mic-btn" id="actionBtn" onclick="toggleAction()">
                        
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
                            <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                            <line x1="12" y1="19" x2="12" y2="23"></line>
                            <line x1="8" y1="23" x2="16" y2="23"></line>
                        </svg>
                    </button>
                </div>
            </div>
            <div class="recording-indicator hidden" id="recordingIndicator">
                <div class="recording-visualization">
                    <div class="nebula-wave"></div>
                    <div class="recording-controls">
                        <div class="recording-time">0:00</div>
                        <div class="recording-actions">
                            <button class="recording-cancel" onclick="stopRecording(true)">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <line x1="18" y1="6" x2="6" y2="18"></line>
                                    <line x1="6" y1="6" x2="18" y2="18"></line>
                                </svg>
                                Cancel
                            </button>
                            <button class="recording-done" onclick="sendVoiceMessage()">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <polyline points="20 6 9 17 4 12"></polyline>
                                </svg>
                                Done
                            </button>
                        </div>
                    </div>
                </div>
            </div>
            <div class="footer-info" id="footerInfo">
            </div>
        </div>
    </div>

</body>
</html>
