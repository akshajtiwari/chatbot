<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>College Chatbot Widget</title>
    <link rel="stylesheet" href="chatbot.css">
    <script src="chatbot.js" defer></script>
</head>
<body>
    <div class="chat-bubble" id="chatBubble">
        <button class="chat-trigger" onclick="openChatbot()">
            <div class="chat-avatar"></div>
            <div class="notification-dot"></div>
            <div class="tooltip">Need help? Ask me anything!</div>
        </button>
    </div>

    <div class="chatbot-widget" id="chatbotWidget">
        <div class="chat-header">
            <div class="avatar-section">
                <div class="avatar">
                    <div class="avatar-inner"></div>
                </div>
                <div class="status-info">
                    <h3>Campus Assistant</h3>
                    <div class="online-status">
                        <div class="status-dot"></div>
                        <span>Online</span>
                    </div>
                </div>
            </div>
            <div class="header-controls">
                <button class="close-btn" onclick="closeChatbot()">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>
        </div>

        <div class="messages-container" id="messagesContainer"></div>

        <div class="input-area">
            <div class="input-container">
                <div class="input-wrapper">
                    <textarea 
                        id="messageInput" 
                        class="message-input" 
                        placeholder="Type your message..." 
                        rows="1"
                        oninput="handleInput(this)"
                        onkeypress="handleKeyPress(event)"
                    ></textarea>
                    <button class="input-action-btn send-btn" id="actionBtn" onclick="sendMessage()">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
                            <line x1="22" y1="2" x2="11" y2="13"></line>
                            <polygon points="22,2 15,22 11,13 2,9 22,2"></polygon>
                        </svg>
                    </button>
                </div>
            </div>
            <div class="footer-info" id="footerInfo"></div>
        </div>
    </div>
</body>
</html>
